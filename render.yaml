services:
  - type: web
    name: version-aware-rag-public-demo
    runtime: python
    rootDir: versioned-rag-service
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn src.public_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: public_demo
      - key: RD_V2_ALLOW_EXTERNAL_GENERATION
        value: "true"
      - key: RD_V2_GENERATION_PROVIDER
        value: deepseek
      - key: RD_V2_GENERATION_MODEL
        value: deepseek-v4-flash
      - key: RAG_PUBLIC_CORPUS_ROOT
        value: public_corpus_paddleocr
      - key: RAG_PUBLIC_RETRIEVAL_CONFIG
        value: public_corpus_paddleocr/public_retrieval_runtime.json
      - key: DEEPSEEK_API_KEY
        sync: false
